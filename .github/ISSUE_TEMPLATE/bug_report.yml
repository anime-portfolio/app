name: 🐛 Bug Report
description: Report a bug or issue with the Anime Portfolio
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.
        
        🔍 **Before submitting:** Please search existing issues to avoid duplicates.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      description: Please ensure you've completed these steps before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have read the [Contributing Guidelines](../../CONTRIBUTING.md)
          required: true
        - label: I have tested this on the latest version
          required: true

  - type: textarea
    id: bug-description
    attributes:
      label: 🐛 Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ Actual Behavior
      description: A clear and concise description of what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots / Videos
      description: If applicable, add screenshots or videos to help explain your problem
      placeholder: Drag and drop images/videos here or paste URLs

  - type: dropdown
    id: browser
    attributes:
      label: 🌐 Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (please specify in additional context)
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser Version
      description: What version of the browser are you using?
      placeholder: e.g., 118.0.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating System
      description: Which operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other (please specify in additional context)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version (if applicable)
      description: If you're running this locally, what version of Node.js?
      placeholder: e.g., 18.17.0

  - type: dropdown
    id: deployment
    attributes:
      label: 🚀 Deployment Method
      description: How are you running the portfolio?
      options:
        - Local development (npm run dev)
        - Local build (npm run build)
        - Vercel
        - Netlify
        - GitHub Pages
        - Other hosting service
        - Self-hosted
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 🔍 Error Logs
      description: Please paste any relevant error logs (browser console, terminal, etc.)
      placeholder: Paste error logs here...
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 📝 Additional Context
      description: Add any other context about the problem here
      placeholder: |
        - Custom modifications made to the code
        - Specific anime theme being used
        - Any browser extensions that might interfere
        - Network conditions
        - etc.

  - type: dropdown
    id: theme
    attributes:
      label: 🎨 Theme in Use
      description: Which theme were you using when the bug occurred?
      options:
        - Weltschmerz (dark)
        - Crystalline (light)
        - Custom theme
        - All themes affected
        - Not theme-specific

  - type: checkboxes
    id: willing-to-help
    attributes:
      label: 🤝 Contribution
      description: Are you willing to help fix this issue?
      options:
        - label: I am willing to submit a pull request for this issue
        - label: I can help test potential fixes
        - label: I can provide more information if needed